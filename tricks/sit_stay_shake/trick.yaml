# sit_stay_shake: fetched with get_trick.py (W&B run 6ffmsd5n).
# The description is what Gemini reads when deciding whether to play this trick.
description: From standing, sits down and stays sitting until asked for something else. Use it when someone says sit or stay. While it sits, it can shake either front paw.
type: policy
policy: policy.json
start_pose: standing
end_pose: sitting
max_body_angle_deg: 60   # the tilt e-stop while the trick plays (the sit leans back about 35 degrees)
# The clips Gemini may ask for while Pupper sits. Pupper must already be sitting in this trick.
actions:
  shake_left: Only while Pupper is sitting in this trick. Shakes Pupper's own left front paw, then keeps sitting. Use it when the person is on Pupper's left.
  shake_right: Only while Pupper is sitting in this trick. Shakes Pupper's own right front paw, then keeps sitting. Use it when the person is on Pupper's right.
# The clip that returns to standing. It plays by itself before any other motion.
exit_clip: stand_up
